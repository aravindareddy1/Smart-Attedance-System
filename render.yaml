services:
  - type: web
    name: smart-attendance-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-attendance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://aravindareddy1.github.io

databases:
  - name: smart-attendance-db
    plan: free
    databaseName: smart_attendance
    user: attendance_admin
