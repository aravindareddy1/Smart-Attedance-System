<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart Attendance System — Redirecting...</title>
    <script>
        // Single Page Application redirect for GitHub Pages
        // Preserves path segments when refreshed
        (function() {
            var pathSegmentsToKeep = 1; // repository name segment
            var l = window.location;
            var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
            var search = l.search ? '&' + l.search.slice(1) : '';
            var hash = l.hash ? l.hash : (path ? '#' + path : '');
            
            // Redirect to base path with hash
            var repoName = l.pathname.split('/')[1] || '';
            var base = repoName ? '/' + repoName + '/' : '/';
            l.replace(base + hash);
        })();
    </script>
</head>
<body>
    <p>Redirecting to application...</p>
</body>
</html>
