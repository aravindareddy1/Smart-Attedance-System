{% extends "base.html" %}

{% block title %}Edit Class — {{ cls.name }}{% endblock %}
{% block page_title %}Edit Classroom{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-800">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Edit Class: {{ cls.name }}</h2>
        <form method="POST" class="space-y-4">
            {{ form.hidden_tag() }}

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Class Identifier</label>
                <input type="text" name="{{ form.name.name }}" value="{{ form.name.data or '' }}" required
                       class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Department</label>
                <input type="text" name="{{ form.department.name }}" value="{{ form.department.data or '' }}" required
                       class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Year</label>
                    <input type="number" name="{{ form.year.name }}" min="1" max="6" value="{{ form.year.data or 3 }}" required
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Section</label>
                    <input type="text" name="{{ form.section.name }}" value="{{ form.section.data or 'A' }}" required
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Academic Year</label>
                <input type="text" name="{{ form.academic_year.name }}" value="{{ form.academic_year.data or '2025-2026' }}" required
                       class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
            </div>

            <div class="pt-2 flex items-center justify-end space-x-3">
                <a href="{{ url_for('admin.classes') }}" class="px-4 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">Cancel</a>
                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-700">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
