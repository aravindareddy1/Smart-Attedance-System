{% extends "base.html" %}

{% block title %}Edit Subject — {{ sub.code }}{% endblock %}
{% block page_title %}Edit Subject{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-800">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Edit Subject: {{ sub.code }} - {{ sub.name }}</h2>
        <form method="POST" class="space-y-4">
            {{ form.hidden_tag() }}

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Subject Name</label>
                <input type="text" name="{{ form.name.name }}" value="{{ form.name.data or '' }}" required
                       class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Subject Code</label>
                <input type="text" name="{{ form.code.name }}" value="{{ form.code.data or '' }}" required
                       class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Classroom</label>
                <select name="{{ form.class_id.name }}" required
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
                    {% for val, label in form.class_id.choices %}
                    <option value="{{ val }}" {% if form.class_id.data == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">Assigned Teacher</label>
                <select name="{{ form.teacher_id.name }}" required
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm">
                    {% for val, label in form.teacher_id.choices %}
                    <option value="{{ val }}" {% if form.teacher_id.data == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="pt-2 flex items-center justify-end space-x-3">
                <a href="{{ url_for('admin.subjects') }}" class="px-4 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">Cancel</a>
                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-700">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
