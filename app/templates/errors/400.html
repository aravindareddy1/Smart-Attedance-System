{% extends "base.html" %}

{% block title %}Error 400 — Bad Request{% endblock %}
{% block page_title %}Invalid Request{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16">
    <div class="text-7xl font-black text-amber-500 font-mono mb-2">400</div>
    <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Bad Request</h2>
    <p class="text-xs text-slate-500 mb-6">The server could not understand the request due to invalid parameters or formatting.</p>
    <a href="{{ url_for('auth.dashboard') }}" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition inline-block">
        ← Return to Dashboard
    </a>
</div>
{% endblock %}
