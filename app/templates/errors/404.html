{% extends "base.html" %}

{% block title %}Error 404 — Page Not Found{% endblock %}
{% block page_title %}Resource Not Found{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16">
    <div class="text-7xl font-black text-blue-600 dark:text-blue-400 font-mono mb-2">404</div>
    <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Page Not Found</h2>
    <p class="text-xs text-slate-500 mb-6">The page or resource you requested could not be located on the server.</p>
    <a href="{{ url_for('auth.dashboard') }}" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition inline-block">
        ← Return to Dashboard
    </a>
</div>
{% endblock %}
